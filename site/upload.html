<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Checklist — The Colyer Team</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.header{background:#1e293b;border-bottom:3px solid #d97706;padding:20px;display:flex;align-items:center;gap:16px;justify-content:center}
.header img{width:56px;height:56px;border-radius:50%;object-fit:cover}
.header h1{font-size:18px;color:#fff}
.header span{color:#d97706;font-size:13px}
.container{max-width:700px;margin:0 auto;padding:20px}
.greeting{font-size:20px;margin-bottom:4px;color:#fff}
.subtitle{color:#94a3b8;font-size:14px;margin-bottom:24px}
.category{margin-bottom:24px}
.cat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#64748b;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #334155}
.item{background:#1e293b;border-radius:8px;padding:14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px}
.item.done{opacity:.7}
.check{width:22px;height:22px;border-radius:50%;border:2px solid #475569;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.check.received{background:#16a34a;border-color:#16a34a;color:#fff}
.check svg{width:14px;height:14px}
.item-content{flex:1;min-width:0}
.item-label{font-size:14px;color:#e2e8f0}
.item.done .item-label{text-decoration:line-through;color:#64748b}
.item-desc{font-size:12px;color:#94a3b8;margin-top:2px}
.item-files{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.file-chip{font-size:11px;background:#334155;color:#94a3b8;padding:2px 8px;border-radius:4px}
.upload-btn{background:#2563eb;color:#fff;border:none;padding:8px 14px;border-radius:6px;font-size:12px;cursor:pointer;flex-shrink:0;align-self:center}
.upload-btn:hover{background:#1d4ed8}
.upload-btn:disabled{background:#475569;cursor:not-allowed}
.upload-btn.uploading{background:#d97706}
.error{background:#7f1d1d;color:#fca5a5;padding:20px;border-radius:8px;text-align:center;margin-top:40px}
.loading{text-align:center;padding:60px;color:#94a3b8}
.progress{font-size:13px;color:#d97706;margin-top:12px;text-align:center}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="header">
  <img src="https://apuctuqlmykeemtcasji.supabase.co/storage/v1/object/public/profile-photos/57f82d21-31e6-45b9-aa0d-c7b8764f464a/1770136298733-ri7748.png" alt="Mike">
  <div><h1>The Colyer Team</h1><span>Document Checklist</span></div>
</div>
<div class="container" id="app">
  <div class="loading">Loading your checklist...</div>
</div>
<script>
const SUPABASE_URL = 'https://apuctuqlmykeemtcasji.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwdWN0dXFsbXlrZWVtdGNhc2ppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk3ODY5NjMsImV4cCI6MjA3NTM2Mjk2M30.Kyjei2lczrVkFJkOzI8ViLEc-qiOBPrv5TtT6G33MHU';
const headers = {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY};
const app = document.getElementById('app');
const token = new URLSearchParams(location.search).get('token');

// Strip token from URL to prevent leaking via Referer header, browser history, etc.
if (token && window.history.replaceState) {
  const cleanUrl = location.pathname;
  window.history.replaceState({}, document.title, cleanUrl);
}

if (!token) { app.innerHTML = '<div class="error">Invalid link. No access token provided.</div>'; }
else { init(); }

async function init() {
  try {
    // Fetch needs list
    const nlRes = await fetch(`${SUPABASE_URL}/rest/v1/loan_needs_list?access_token=eq.${token}&select=*`, {headers});
    const nlData = await nlRes.json();
    if (!nlData.length) { app.innerHTML = '<div class="error">This link is invalid or has expired.</div>'; return; }
    const nl = nlData[0];

    // Fetch borrower
    const appRes = await fetch(`${SUPABASE_URL}/rest/v1/loan_applications?id=eq.${nl.loan_application_id}&select=first_name,last_name,loan_purpose`, {headers});
    const appData = await appRes.json();
    const borrower = appData[0] || {};

    // Fetch existing uploads
    const docsRes = await fetch(`${SUPABASE_URL}/rest/v1/needs_list_documents?needs_list_id=eq.${nl.id}&select=*`, {headers: {...headers, 'Authorization': 'Bearer ' + SUPABASE_KEY}});
    const docs = await docsRes.json();
    const docsByIdx = {};
    if (Array.isArray(docs)) docs.forEach(d => { (docsByIdx[d.item_index] = docsByIdx[d.item_index] || []).push(d); });

    render(nl, borrower, docsByIdx);
  } catch(e) {
    app.innerHTML = '<div class="error">Something went wrong. Please try again later.</div>';
    console.error(e);
  }
}

const CAT_ORDER = ['income','assets','property','identity','questions','other'];
const CAT_LABELS = {income:'Income',assets:'Assets',property:'Property',identity:'Identity',questions:'Questions',other:'Other'};

// Escape HTML to prevent XSS from database-sourced values
function esc(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// Allowed file types and size limits for uploads
const ALLOWED_TYPES = ['application/pdf','image/jpeg','image/png','image/gif','image/webp'];
const ALLOWED_EXTS = ['.pdf','.jpg','.jpeg','.png','.gif','.webp'];
const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10MB per file

function render(nl, borrower, docsByIdx) {
  const items = nl.items || [];
  const cats = {};
  items.forEach((item, idx) => {
    const cat = item.category || 'other';
    (cats[cat] = cats[cat] || []).push({...item, _idx: idx});
  });
  const received = items.filter(i => i.received).length;
  
  let html = `<p class="greeting">Hi ${esc(borrower.first_name) || 'there'},</p>
    <p class="subtitle">Here's your document checklist. Upload each item below. (${received}/${items.length} complete)</p>`;
  
  const orderedCats = CAT_ORDER.filter(c => cats[c]).concat(Object.keys(cats).filter(c => !CAT_ORDER.includes(c)));
  
  for (const cat of orderedCats) {
    html += `<div class="category"><div class="cat-label">${esc(CAT_LABELS[cat] || cat)}</div>`;
    for (const item of cats[cat]) {
      const done = item.received;
      const uploads = docsByIdx[item._idx] || [];
      html += `<div class="item ${done ? 'done' : ''}" id="item-${item._idx}">
        <div class="check ${done ? 'received' : ''}">
          ${done ? '<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"/></svg>' : ''}
        </div>
        <div class="item-content">
          <div class="item-label">${esc(item.label)}</div>
          ${item.description ? `<div class="item-desc">${esc(item.description)}</div>` : ''}
          ${uploads.length ? `<div class="item-files">${uploads.map(u => `<span class="file-chip">📎 ${esc(u.file_name)}</span>`).join('')}</div>` : ''}
        </div>
        <button class="upload-btn" onclick="pickFile(${item._idx})" ${done ? '' : ''}>Upload</button>
        <input type="file" id="file-${item._idx}" onchange="uploadFile(${item._idx}, '${nl.id}')" multiple>
      </div>`;
    }
    html += '</div>';
  }
  app.innerHTML = html;
}

function pickFile(idx) { document.getElementById('file-' + idx).click(); }

async function uploadFile(idx, needsListId) {
  const input = document.getElementById('file-' + idx);
  const files = input.files;
  if (!files.length) return;

  // Validate file types and sizes
  for (const file of files) {
    const ext = '.' + file.name.split('.').pop().toLowerCase();
    if (!ALLOWED_EXTS.includes(ext) && !ALLOWED_TYPES.includes(file.type)) {
      alert('File type not allowed: ' + file.name + '. Accepted: PDF, JPG, PNG, GIF, WebP.');
      input.value = '';
      return;
    }
    if (file.size > MAX_FILE_SIZE) {
      alert('File too large: ' + file.name + '. Maximum size is 10MB per file.');
      input.value = '';
      return;
    }
  }
  const btn = document.querySelector(`#item-${idx} .upload-btn`);
  btn.textContent = 'Uploading...';
  btn.classList.add('uploading');
  btn.disabled = true;

  try {
    for (const file of files) {
      const path = `${needsListId}/${idx}/${Date.now()}-${file.name}`;
      // Upload to storage
      const upRes = await fetch(`${SUPABASE_URL}/storage/v1/object/needs-list-docs/${path}`, {
        method: 'POST', headers: {...headers, 'Content-Type': file.type || 'application/octet-stream'}, body: file
      });
      if (!upRes.ok) throw new Error('Upload failed: ' + await upRes.text());

      // Insert doc record
      await fetch(`${SUPABASE_URL}/rest/v1/needs_list_documents`, {
        method: 'POST', headers: {...headers, 'Content-Type': 'application/json', 'Prefer': 'return=minimal'},
        body: JSON.stringify({needs_list_id: needsListId, item_index: idx, file_name: file.name, file_path: path, file_size: file.size, mime_type: file.type})
      });
    }

    // Update items jsonb to mark received
    const nlRes = await fetch(`${SUPABASE_URL}/rest/v1/loan_needs_list?access_token=eq.${token}&select=items`, {headers});
    const nlData = await nlRes.json();
    if (nlData.length) {
      const items = nlData[0].items;
      items[idx].received = true;
      await fetch(`${SUPABASE_URL}/rest/v1/loan_needs_list?access_token=eq.${token}`, {
        method: 'PATCH', headers: {...headers, 'Content-Type': 'application/json', 'Prefer': 'return=minimal'},
        body: JSON.stringify({items, updated_at: new Date().toISOString()})
      });
    }

    // Refresh
    init();
  } catch(e) {
    alert('Upload failed: ' + e.message);
    btn.textContent = 'Upload';
    btn.classList.remove('uploading');
    btn.disabled = false;
  }
  input.value = '';
}
</script>
</body>
</html>
